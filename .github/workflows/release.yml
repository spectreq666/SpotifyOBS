name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Create Installer
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Publish .NET Application
        run: |
          dotnet publish WindowsAudioCatcher.csproj -c Release -r win-x64 --self-contained false -o ./publish

      - name: Build Installer (Inno Setup)
        run: |
          iscc.exe installer.iss

      - name: Create Portable Zip
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./SpectreqOBS-Spotify-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Spectreq OBS Spotify ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            Output/SpectreqOBS-Spotify-Setup.exe
            SpectreqOBS-Spotify-win-x64.zip
          body: |
            ### 🚀 Релиз Spectreq OBS Spotify

            #### 📥 Файлы релиза:
            - **SpectreqOBS-Spotify-Setup.exe** — Полноценный установочный файл Windows (с мастером установки и ярлыками).
            - **SpectreqOBS-Spotify-win-x64.zip** — Портативная версия (не требует установки).
